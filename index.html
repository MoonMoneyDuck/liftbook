<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0c0d0f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Liftbook</title>
<style>
:root{
  --bg:#0c0d0f; --surface:#15171b; --surface-2:#1d2025; --surface-3:#262a31; --line:#2b3038;
  --text:#f2f4f7; --text-2:#a7adb8; --muted:#6c7380;
  --accent:#c6f05f; --accent-ink:#11140a; --accent-soft:rgba(198,240,95,.12);
  --good:#5ee08f; --warn:#f6c453; --danger:#ff7a7a; --danger-soft:rgba(255,122,122,.12);
  --radius:18px; --radius-sm:12px;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f3f4f1; --surface:#ffffff; --surface-2:#f1f2ee; --surface-3:#e6e8e2; --line:#dcdfd6;
    --text:#14161a; --text-2:#4f5560; --muted:#7c838e;
    --accent:#4f7a00; --accent-ink:#ffffff; --accent-soft:rgba(79,122,0,.10);
    --good:#16803c; --warn:#a86b00; --danger:#c53030; --danger-soft:rgba(197,48,48,.08);
    --shadow:0 10px 30px rgba(20,22,26,.10);
    color-scheme:light;
  }
}
:root[data-theme="dark"]{color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom));overscroll-behavior-y:contain}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.num{font-variant-numeric:tabular-nums}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.02em;font-size:20px}
.brand svg{width:28px;height:28px}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--text-2)}
.icon-btn:active{background:var(--surface-2)}
.icon-btn svg{width:22px;height:22px}
main{padding:4px 16px 24px;max-width:640px;margin:0 auto}
body.resting main{padding-bottom:84px}
.chip-btn{height:40px;padding:0 16px;font-size:13px}
h1{font-size:28px;letter-spacing:-.03em;margin:8px 0 4px;line-height:1.1}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:26px 0 10px;font-weight:700}
h3{margin:0;font-size:17px;letter-spacing:-.01em;line-height:1.25}
.sub{color:var(--text-2);margin:0 0 16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--surface-2);
  color:var(--text-2);font-size:12px;font-weight:600;white-space:nowrap}
.chip.gym{background:var(--accent-soft);color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 20px;border-radius:16px;
  font-weight:700;background:var(--surface-2);color:var(--text);transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:disabled{opacity:.35}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.block{width:100%}
.btn.small{height:40px;padding:0 14px;border-radius:12px;font-size:14px}
.link{color:var(--text-2);font-size:14px;font-weight:600;padding:10px}
.empty{color:var(--muted);text-align:center;padding:24px 8px}

/* group picker */
.groups{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 16px}
.gbtn{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 10px;text-align:left;min-height:64px;
  display:flex;flex-direction:column;justify-content:space-between;gap:4px}
.gbtn b{font-size:15px}
.gbtn small{color:var(--muted);font-size:12px}
.gbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.gbtn[aria-pressed="true"] small{color:var(--accent-ink);opacity:.7}

/* session */
.sess-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:6px 0 14px}
.sess-head .meta{color:var(--text-2);font-size:14px}
.ex-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.ex-head{display:flex;align-items:flex-start;gap:12px}
.pos{flex:none;width:42px;height:42px;border-radius:13px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;
  font-weight:900;font-size:21px;letter-spacing:-.04em}
.ex-title{flex:1;min-width:0}
.ex-title .row{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;align-items:center}
.slot{font-size:12px;color:var(--text-2);font-weight:600}
.hint{margin:12px 0 4px;padding:10px 12px;border-radius:12px;background:var(--surface-2);font-size:14px;color:var(--text-2)}
.hint b{color:var(--text)}
.hint .goal{display:block;margin-top:4px;color:var(--accent);font-weight:700}
.hint .goal small{color:var(--text-2);font-weight:500}
.note-in{width:100%;margin-top:10px;background:transparent;border:1px dashed var(--line);border-radius:10px;padding:8px 10px;font-size:14px;color:var(--text-2)}
.note-in:focus{outline:none;border-style:solid;border-color:var(--accent);color:var(--text)}
.sets{margin-top:10px}
.set-h,.set-row{display:grid;grid-template-columns:26px 1fr 1fr 18px 1fr 48px;gap:6px;align-items:center}
.set-h{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding:0 0 4px}
.set-row{padding:4px 0;border-radius:12px}
.set-row .idx{color:var(--muted);font-weight:700;text-align:center;font-size:14px}
.set-row .prev{color:var(--muted);font-size:13px;text-align:center}
.set-row input{width:100%;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);text-align:center;font-size:18px;font-weight:700;
  font-variant-numeric:tabular-nums;padding:0 4px}
.set-row input::placeholder{color:var(--muted);font-weight:600}
.set-row input:focus{outline:none;border-color:var(--accent)}
.set-row .x{text-align:center;color:var(--muted)}
.chk{height:44px;border-radius:12px;background:var(--surface-3);display:grid;place-items:center;color:var(--muted)}
.chk svg{width:22px;height:22px}
.set-row.done input{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.set-row.done .chk{background:var(--accent);color:var(--accent-ink)}
.add-set{margin-top:6px;width:100%;height:40px;border-radius:12px;color:var(--text-2);font-weight:700;font-size:14px;background:transparent;border:1px dashed var(--line)}
.add-ex{width:100%;height:64px;border-radius:var(--radius);border:2px dashed var(--line);color:var(--text);font-weight:800;font-size:16px;display:flex;gap:10px;align-items:center;justify-content:center}
.add-ex svg{width:22px;height:22px;color:var(--accent)}

/* lists */
.list{display:flex;flex-direction:column;gap:8px}
.row-item{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;width:100%}
.row-item .grow{flex:1;min-width:0}
.row-item .t{font-weight:700;overflow:hidden;text-overflow:ellipsis}
.row-item .s{color:var(--text-2);font-size:13px;margin-top:2px}
.row-item .r{color:var(--text-2);font-size:13px;text-align:right;white-space:nowrap}
.chev{color:var(--muted);width:18px;height:18px;flex:none}
.scroller{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 6px;margin:0 -16px;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.fchip{flex:none;height:36px;padding:0 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:14px;color:var(--text-2)}
.fchip[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.search{width:100%;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:0 14px;font-size:16px;margin:10px 0}
.search:focus{outline:none;border-color:var(--accent)}

/* history */
.hcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;width:100%;text-align:left;display:block}
.hcard .top-line{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.hcard .date{font-weight:800;font-size:17px}
.hcard ol{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.hcard li{display:grid;grid-template-columns:24px 1fr;gap:8px;font-size:14px}
.hcard li .n{width:22px;height:22px;border-radius:7px;background:var(--surface-3);display:grid;place-items:center;font-size:12px;font-weight:800}
.hcard li .sets-t{color:var(--text-2)}
.badge-pr{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:6px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:800;vertical-align:1px}

/* detail */
.back{display:inline-flex;align-items:center;gap:4px;color:var(--text-2);font-weight:700;padding:8px 0}
.back svg{width:20px;height:20px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat .k{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.stat .v{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-top:2px}
.stat .v small{font-size:13px;color:var(--text-2);font-weight:600}
.chart-card{padding:14px 10px 10px}
.chart-card .ct{padding:0 6px;font-weight:700}
.chart-card .cs{padding:0 6px;color:var(--muted);font-size:12px;margin-top:2px}
.chart svg{width:100%;height:auto;display:block;margin-top:8px;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{fill:var(--muted);font-size:10px}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .dot circle{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.chart .dot text{fill:var(--text);font-size:10px;font-weight:800;text-anchor:middle;dominant-baseline:central}
.chart .dot.sel circle{fill:var(--accent)}
.chart .dot.sel text{fill:var(--accent-ink)}
.chart .hit{fill:transparent}
.readout{margin:8px 6px 0;padding:10px 12px;border-radius:12px;background:var(--surface-2);font-size:14px;color:var(--text-2)}
.readout b{color:var(--text)}
.hrow{padding:12px 0;border-top:1px solid var(--line)}
.hrow:first-child{border-top:0}
.hrow .l1{display:flex;justify-content:space-between;gap:8px;font-weight:700}
.hrow .l2{color:var(--text-2);font-size:14px;margin-top:2px}
.hrow .l3{color:var(--muted);font-size:13px;margin-top:2px;font-style:italic}
.ord{display:inline-block;padding:1px 8px;border-radius:7px;background:var(--surface-3);font-size:12px;font-weight:800;color:var(--text-2)}

/* bottom nav */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(3,1fr);
  padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 90%,transparent);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line)}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--muted);font-size:12px;font-weight:700;border-radius:12px}
.tabs button svg{width:24px;height:24px}
.tabs button[aria-current="page"]{color:var(--text)}
.tabs button[aria-current="page"] svg{color:var(--accent)}

/* rest pill */
.rest{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom));z-index:35;
  display:flex;align-items:center;gap:6px;padding:6px 6px 6px 16px;border-radius:999px;background:var(--text);color:var(--bg);
  box-shadow:var(--shadow);font-weight:800;white-space:nowrap}
.rest .tm{font-size:20px;min-width:62px;font-variant-numeric:tabular-nums}
.rest .lbl{font-size:12px;opacity:.6;margin-right:4px}
.rest button{height:40px;min-width:46px;padding:0 10px;border-radius:999px;background:color-mix(in srgb,var(--bg) 12%,transparent);font-weight:800;font-size:13px}
.rest.go{background:var(--accent);color:var(--accent-ink)}
.rest[hidden]{display:none}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:50}
.sheet-wrap[hidden]{display:none}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.55);animation:fade .18s}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--surface);border-radius:24px 24px 0 0;
  padding:10px 16px calc(20px + env(safe-area-inset-bottom));animation:up .22s cubic-bezier(.2,.8,.2,1);max-width:640px;margin:0 auto}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.sheet h3{font-size:20px;margin-bottom:12px}
.sheet .opt{display:flex;align-items:center;gap:12px;width:100%;padding:14px 4px;border-bottom:1px solid var(--line);font-weight:700;text-align:left}
.sheet .opt:last-child{border-bottom:0}
.sheet .opt.danger{color:var(--danger)}
.sheet .opt svg{width:20px;height:20px;color:var(--text-2)}
.field{display:block;margin:0 0 12px}
.field span{display:block;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);padding:10px 12px;font-size:16px}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{height:40px;padding:0 14px;border-radius:12px;background:var(--surface-2);font-weight:700;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.ftable{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
.ftable td,.ftable th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left}
.ftable th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.explain{color:var(--text-2);font-size:14px}
.pr-list{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.big-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 4px}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-150%);z-index:60;background:var(--text);color:var(--bg);
  padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;transition:transform .25s;box-shadow:var(--shadow);max-width:90vw}
.toast.show{transform:translate(-50%,0)}
.gymseg{display:grid;grid-template-columns:repeat(4,1fr);margin:12px 0 2px}
.seg.gymseg button{min-width:0;padding:0 4px;font-size:13px;height:44px}
.pick-sec{margin:14px 0 6px;font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="16" fill="var(--accent)"/><rect x="14" y="36" width="9" height="14" rx="3" fill="var(--accent-ink)"/><rect x="27.5" y="26" width="9" height="24" rx="3" fill="var(--accent-ink)"/><rect x="41" y="14" width="9" height="36" rx="3" fill="var(--accent-ink)"/></svg>
    Liftbook
  </div>
  <button class="icon-btn" data-act="settings" aria-label="Settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
  </button>
</header>

<main id="view"></main>

<div id="rest" class="rest" hidden></div>

<nav class="tabs" aria-label="Sections">
  <button data-act="tab" data-tab="train"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6.5 6.5v11M17.5 6.5v11M3 9.5v5M21 9.5v5M6.5 12h11"/></svg>Train</button>
  <button data-act="tab" data-tab="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>History</button>
  <button data-act="tab" data-tab="exercises"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5M4 19h16M8 15l4-5 3 3 5-6"/></svg>Progress</button>
</nav>

<div id="sheet" class="sheet-wrap" hidden><div class="scrim" data-act="close-sheet"></div><div class="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast" class="toast" role="status"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
'use strict';
/* ============ constants ============ */
const KEY = 'liftbook.v1';
const GROUPS = [
  ['chest','Chest'],['back','Back'],['legs','Legs'],['biceps','Biceps'],['triceps','Triceps'],
  ['frontdelts','Front Delts'],['sidedelts','Side Delts'],['reardelts','Rear Delts'],
  ['calves','Calves'],['abs','Abs'],['traps','Traps']
];
const GYMS = [['aalborg', 'Aalborg'], ['bronderslev', 'Brønderslev'], ['klarup', 'Klarup'], ['other', 'Other']];
const gymName = id => (GYMS.find(g => g[0] === id) || [id, 'Any gym'])[1];
// How strong you are on the Nth exercise for a muscle, relative to doing it first.
// Starting guesses; the app replaces them with your own numbers as data comes in.
const DEFAULT_F = {1:1, 2:0.95, 3:0.91, 4:0.88, 5:0.86};
const PRIOR = 4;          // how many "pretend" observations the starting guess is worth
const PAIR_WINDOW = 60;   // days: a 2nd/3rd-slot session is compared with the nearest 1st-slot session within this window

const ICON = {
  chev:'<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  dots:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>',

/* ============ helpers ============ */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-5);
const num = v => { const n = parseFloat(String(v ?? '').replace(',', '.')); return isFinite(n) ? n : NaN; };

const roundTo = (x, inc) => Math.round(x / inc) * inc;

const gName = id => (GROUPS.find(g => g[0] === id) || [id, id])[1];
const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const dateObj = s => new Date(s + 'T12:00:00');
const fmtDate = (s, long) => { const d = dateObj(s); const o = {day:'numeric', month:'short'}; if (long) o.weekday = 'short'; if (d.getFullYear() !== new Date().getFullYear()) o.year = 'numeric'; return d.toLocaleDateString('en-GB', o); };

/* ============ storage ============ */
function emptyDb() {
  return {v: 1, exercises: [], sessions: [], active: null, rest: null, keepV2: false, settings: {rest: 120, inc: 2.5, gym: 'aalborg'}};
}
let readOnly = false;   // set when the stored data was written by a newer version of the app
function load() {
  let raw = null;
  try { raw = localStorage.getItem(KEY); } catch (e) {}
  if (raw) {
    let d = null; try { d = JSON.parse(raw); } catch (e) {}
    if (d && d.v === 1) return d;
    if (d && d.v > 1) { readOnly = true; return d; }
    // unreadable: keep a copy instead of silently replacing it
    try { localStorage.setItem(KEY + '.corrupt.' + Date.now(), raw); } catch (e) {}
  }
  const d = emptyDb(); try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) {}
  return d;
}
function save() {
  dataV++;
  if (readOnly) { toast('Old app version — close and reopen Liftbook to update'); return; }
  try { localStorage.setItem(KEY, JSON.stringify(db)); }
  catch (e) { toast('Could not save — storage blocked or full'); }
}

let dataV = 0;   // bumped on every save, so cached lookups know when to refresh
const GYM_IDS = GYMS.map(g => g[0]);
// gyms used to be free text ("Brønderslev", "Manna", …): turn them into gym ids
const oldGym = g => GYM_IDS.includes(g) ? g : /brønderslev/i.test(g || '') ? 'bronderslev' : /klarup/i.test(g || '') ? 'klarup'
  : /manna|hals|fw/i.test(g || '') ? 'other' : /gym|gf|aalborg/i.test(g || '') ? 'aalborg' : '';
function migrateGyms(d) {
  d.settings.gym ||= 'aalborg';
  d.exercises.forEach(e => { e.gym = oldGym(e.gym); });
  const fill = x => {
    if (!x || x.gym) return;   // a workout without a gym gets the gym most of its exercises belong to
    const n = {};
    x.entries.forEach(en => { const g = d.exercises.find(e => e.id === en.exId)?.gym; if (g) n[g] = (n[g] || 0) + 1; });
    x.gym = Object.keys(n).sort((a, b) => n[b] - n[a])[0] || d.settings.gym;
  };
  d.sessions.forEach(fill); fill(d.editBackup);
}
let db = load();
migrateGyms(db);
let factors = {};
const ui = {tab: 'train', pick: new Set(), exGroup: 'all', exQuery: '', detail: null, sel: null, sheetOpen: false,
            viewGym: db.settings.gym, histLimit: 40};

// One-time import of the full Google Keep history (keep-seed.json). Workouts logged in the app are kept.
async function importKeep() {
  if (db.keepV2 || readOnly) return;
  let data;
  try { const r = await fetch('keep-seed.json', {cache: 'no-cache'}); if (!r.ok) return; data = await r.json(); }
  catch (e) { return; }   // offline: try again next launch
  if (db.keepV2 || readOnly) return;   // erased or restored while downloading
  if (!data || !Array.isArray(data.exercises) || !Array.isArray(data.sessions)) return;
  const norm = n => String(n).toLowerCase().replace(/\s*\((manna|hals|fw|greece)\)$/, '').replace(/[–—-]/g, ' ').replace(/\s+/g, ' ').trim();
  const alias = {'ct fletcher triceps extension': 'ct fletcher triceps exercise', 'cable fly high pulley': 'cable fly highest pulley'};
  const exercises = data.exercises.map(e => ({...e}));
  const seedNames = new Set(exercises.map(e => e.groupId + '|' + norm(e.name)));
  const mine = JSON.parse(JSON.stringify(db.sessions.filter(x => x.src !== 'keep')));   // workouts logged in the app
  const backup = db.editBackup && mine.some(x => x.id === db.editBackup.id) ? JSON.parse(JSON.stringify(db.editBackup)) : null;
  const used = new Set([...mine, ...(backup ? [backup] : [])].flatMap(x => x.entries.map(en => en.exId)));
  const remap = {};
  for (const old of db.exercises) {
    if (exercises.some(e => e.id === old.id)) continue;
    const n = alias[norm(old.name)] || norm(old.name);
    const cands = exercises.filter(e => e.groupId === old.groupId && norm(e.name) === n);
    const match = cands.find(e => e.gym === old.gym) ||
      (!old.gym && (cands.find(e => e.gym === db.settings.gym) || cands.find(e => e.gym === 'aalborg') || cands[0])) || null;
    if (match) {
      remap[old.id] = match.id;
      if (!match.notes && old.notes) match.notes = old.notes;
      if (old.inc && old.inc !== 2.5) match.inc = old.inc;
    } else if (used.has(old.id) || !seedNames.has(old.groupId + '|' + n)) exercises.push({...old});   // keep the user's own exercises
  }
  for (const x of [...mine, ...(backup ? [backup] : [])]) x.entries.forEach(en => { if (remap[en.exId]) en.exId = remap[en.exId]; });
  // a day already logged in the app wins over the same day from Keep
  const keep = data.sessions.filter(x => !mine.some(m => m.date === x.date && m.gym === x.gym))
    .map(x => ({id: uid(), date: x.date, gym: x.gym, groups: x.groups, done: true, src: 'keep', entries: x.entries.map(en => ({id: uid(), ...en}))}));
  try { localStorage.setItem(KEY + '.before-keep-import', JSON.stringify(db)); } catch (e) {}
  if (db.active && !mine.some(x => x.id === db.active)) { db.active = null; db.rest = null; delete db.editBackup; }
  if (backup) db.editBackup = backup;
  db.exercises = exercises; db.sessions = [...keep, ...mine]; db.keepV2 = true;
  if (ui.sheetOpen) closeSheet();
  if (ui.tab === 'detail') { leaveDetail(); ui.tab = 'exercises'; }
  computeFactors(); recomputePRs(); save(); render(); renderRest();
  toast(`Imported ${keep.length} workouts from Google Keep`);
}
// newest logged date per exercise (cached until the next save)
let lastMemo = {v: -1, m: {}};
function lastDates() {
  if (lastMemo.v !== dataV) {
    const m = {}, en1 = {};
    for (const x of db.sessions) if (x.done) for (const en of x.entries) if (!m[en.exId] || x.date > m[en.exId]) { m[en.exId] = x.date; en1[en.exId] = en; }
    lastMemo = {v: dataV, m, en: en1};
  }
  return lastMemo.m;
}
// top set of the newest logged entry for an exercise
const lastTop = id => { lastDates(); const en = lastMemo.en[id]; return en && (bestOf(en).set || en.sets.filter(st => st.done).sort((x, y) => num(y.r) - num(x.r))[0]); };
const byRecent = (a, b) => (lastDates()[b.id] || '').localeCompare(lastDates()[a.id] || '') || a.name.localeCompare(b.name);

/* ============ the order model ============ */
let exMemo = {};
const getEx = id => {
  if (exMemo.v !== dataV || exMemo.a !== db.exercises || exMemo.n !== db.exercises.length)
    exMemo = {v: dataV, a: db.exercises, n: db.exercises.length, m: new Map(db.exercises.map(e => [e.id, e]))};
  return exMemo.m.get(id);
};
const getActive = () => db.sessions.find(s => s.id === db.active);
const slot = en => Math.max(1, Math.round(+en.gpos || +en.pos || 1));
const known = en => (+en.gpos || +en.pos) > 0;   // false for old Keep entries with no order written down
function bestOf(en) {
  let e = 0, set = null;
  for (const s of en.sets) if (s.done) { const v = e1rm(num(s.w), num(s.r)); if (v > e) { e = v; set = s; } }
  return {e, set};
}
// all finished entries for one exercise, newest first (optionally only up to a date)
function logOf(exId, excludeSessionId, upTo) {
  const out = [];
  for (const s of db.sessions) {
    if (!s.done || s.id === excludeSessionId || (upTo && s.date > upTo)) continue;
    for (const en of s.entries) if (en.exId === exId) {
      const b = bestOf(en);
      const top = b.set || en.sets.filter(st => st.done).sort((x, y) => num(y.r) - num(x.r))[0];   // bodyweight: most reps
      if (top) out.push({date: s.date, s, en, best: b.e, top, slot: slot(en), known: known(en)});

}
function computeFactors() {
  const buckets = {2: [], 3: [], 4: [], 5: []}, byEx = {};

    (byEx[en.exId] ||= []).push({t: dateObj(s.date).getTime(), k: Math.min(slot(en), 5), e: b});
  }
  for (const arr of Object.values(byEx)) {
    const firsts = arr.filter(x => x.k === 1);
    if (!firsts.length) continue;
    for (const x of arr) {
      if (x.k === 1) continue;
      let near = null, gap = Infinity;
      for (const f of firsts) { const d = Math.abs(f.t - x.t); if (d < gap) { gap = d; near = f; } }
      if (gap <= PAIR_WINDOW * 864e5) buckets[x.k].push(Math.min(Math.max(x.e / near.e, 0.75), 1.10));   // cap one-off bad/great days
    }

  for (const k of [2, 3, 4, 5]) {

const freshEq = h => h.best / fac(h.slot);
// PR = best order-adjusted 1RM so far, compared with everything before that day
function recomputePRs() {
  const best = {};
  const done = db.sessions.filter(s => s.done).sort((a, b) => a.date.localeCompare(b.date));
  for (const s of done) {
    const todays = [];
    for (const en of s.entries) {
      const cur = bestOf(en).e / fac(slot(en));
      en.pr = cur > 0 && best[en.exId] > 0 && cur > best[en.exId] + 0.01;
      todays.push([en.exId, cur]);
    }
    for (const [id, cur] of todays) best[id] = Math.max(best[id] || 0, cur);
  }
}

function suggest(exId, k, sessionId) {
  const s = db.sessions.find(x => x.id === sessionId);
  const h = logOf(exId, sessionId, s?.date);
  if (!h.length) return null;
  const last = h[0], ex = getEx(exId), inc = ex.inc || db.settings.inc || 2.5;
  const ratio = last.known ? fac(k) / fac(last.slot) : 1;
  const topW = num(last.top.w), topR = num(last.top.r);
  return {last, ratio, inc, same: !last.known || last.slot === k, w: roundTo(topW * ratio, inc), r: topR, topW, topR,

function placeholder(sug, i) {

  const w = sug.same ? num(p.w) : roundTo(num(p.w) * sug.ratio, sug.inc);

/* ============ rendering ============ */
const view = $('#view');
function render() {

  else if (ui.tab === 'history') view.innerHTML = renderHistory();

}

function lastTrained(groupId, gym) {
  let d = null;
  for (const s of db.sessions) if (s.done && s.gym === gym && s.entries.some(en => getEx(en.exId)?.groupId === groupId)) if (!d || s.date > d) d = s.date;

}
function renderStart() {

function renumber(s) {
  if (s.src === 'keep') {   // imported from Keep: keep the order numbers written there, append new ones
    s.entries.forEach(en => {
      if (en.pos != null) return;
      const g = getEx(en.exId)?.groupId;

function chartSVG(h) {
  const bw = h.every(x => !(x.best > 0));   // bodyweight exercise: chart reps instead
  const pts = h.slice().reverse().map(x => ({y: bw ? num(x.top.r) : freshEq(x), x}));
  if (!pts.length) return '<div class="empty">Log this exercise to see a trend.</div>';
  const W = 340, H = 180, L = 36, R = 16, T = 14, B = 26;
  let y0 = Math.min(...pts.map(p => p.y)), y1 = Math.max(...pts.map(p => p.y));
  const pad = Math.max((y1 - y0) * 0.2, y1 * 0.06, 1); y0 -= pad; y1 += pad;
  const step = [1, 2, 2.5, 5, 10, 20, 25, 50].find(s => (y1 - y0) / s <= 4) || 100;
  const ticks = []; for (let v = Math.ceil(y0 / step) * step; v <= y1; v += step) ticks.push(v);
  const X = i => pts.length === 1 ? (L + W - R) / 2 : L + 16 + i * (W - L - R - 24) / (pts.length - 1);
  const Y = v => T + (1 - (v - y0) / (y1 - y0)) * (H - T - B);
  const grid = ticks.map(v => `<line class="grid" x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}"/><text class="axis" x="${L - 6}" y="${Y(v) + 3}" text-anchor="end">${fmt(v)}</text>`).join('');
  const line = pts.length > 1 ? `<polyline class="ln" points="${pts.map((p, i) => `${X(i)},${Y(p.y)}`).join(' ')}"/>` : '';
  const sel = ui.sel ?? pts.length - 1;
  const dense = pts.length > 12;   // long history: small dots, order number only on the tapped one
  const hw = pts.length > 1 ? Math.min(36, (W - L - R - 24) / (pts.length - 1)) : 36;
  const dots = pts.map((p, i) => { const big = !dense || i === sel; return `<g class="dot ${i === sel ? 'sel' : ''}" data-act="pt" data-i="${i}">
      <rect class="hit" x="${X(i) - hw / 2}" y="${T}" width="${hw}" height="${H - T}"/>
      <circle cx="${X(i)}" cy="${Y(p.y)}" r="${big ? 9 : 3.5}"/>${big ? `<text x="${X(i)}" y="${Y(p.y)}">${p.x.known ? p.x.slot : '?'}</text>` : ''}</g>`; });
  if (dense) dots.push(dots.splice(sel, 1)[0]);   // draw the tapped dot on top
  const xl = `<text class="axis" x="${X(0)}" y="${H - 6}" text-anchor="${pts.length === 1 ? 'middle' : 'start'}">${fmtDate(pts[0].x.date)}</text>` +
    (pts.length > 1 ? `<text class="axis" x="${X(pts.length - 1)}" y="${H - 6}" text-anchor="end">${fmtDate(pts[pts.length - 1].x.date)}</text>` : '');
  const p = pts[Math.min(sel, pts.length - 1)];
  const adj = p.x.known && p.x.slot > 1 ? ` → <b class="num">${fmt(Math.round(p.y))} kg</b> adjusted for being ${ord(p.x.slot)}` : '';
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Strength trend">${grid}${line}${dots.join('')}${xl}</svg></div>
    <div class="readout"><b>${fmtDate(p.x.date, true)}</b> · ${p.x.known ? ord(p.x.slot) + ' exercise' : 'order not noted'}<br><span class="num">${esc(setsText(p.x.en.sets))}</span><br>
    ${bw ? `Top set <b class="num">${p.x.top.r} reps</b>` : `Est. 1RM <b class="num">${fmt(Math.round(p.x.best))} kg</b>${adj}`}</div>`;
}
function renderDetail(id) {

function openSheet(html) {

// go back one history entry when the screen is already updated, so the popstate it causes is ignored
let skipPops = 0;

function sheetToPage() { ui.sheetOpen = false; sheetWrap.hidden = true; sheet.innerHTML = ''; }

function pickList(q) {
  const s = getActive(); q = q.trim().toLowerCase();
  const used = new Set(s.entries.map(en => en.exId));
  const match = e => !q || (e.name + ' ' + gymName(e.gym) + ' ' + gName(e.groupId)).toLowerCase().includes(q);
  const here = e => !e.gym || e.gym === s.gym;
  const row = (e, showWhere) => { const last = lastDates()[e.id]; return `<button class="row-item" data-act="pick-ex" data-x="${e.id}" ${used.has(e.id) ? 'style="opacity:.45"' : ''}>

  let out = '';
  const groups = s.groups.length ? s.groups : GROUPS.map(g => g[0]);

    const list = db.exercises.filter(e => e.groupId === g && here(e) && match(e)).sort(byRecent);
    out += list.length ? `<div class="pick-sec">${gName(g)}</div><div class="list">${list.map(e => row(e)).join('')}</div>`

  }
  if (q) {
    const others = db.exercises.filter(e => !(groups.includes(e.groupId) && here(e)) && match(e)).sort(byRecent);

  } else out += `<p class="explain" style="margin-top:12px">Search to find exercises from other gyms or muscle groups.</p>`;
  return out || '<div class="empty">No match.</div>';
}

/* ============ actions ============ */
function startSession() {
  const s = {id: uid(), date: today(), gym: db.settings.gym, groups: GROUPS.map(g => g[0]).filter(g => ui.pick.has(g)), start: Date.now(), done: false, entries: []};
  db.sessions.push(s); db.active = s.id; ui.pick.clear(); save(); render();
}
function addEntry(exId) {
  const s = getActive();
  const h = logOf(exId, s.id, s.date);
  const n = h.length ? Math.max(1, h[0].en.sets.filter(x => x.done).length) : 3;
  const en = {id: uid(), exId, note: '', sets: Array.from({length: n}, () => ({w: '', r: '', done: false}))};
  s.entries.push(en); save(); closeSheet(); render();
  requestAnimationFrame(() => $('#card-' + en.id)?.scrollIntoView({behavior: 'smooth', block: 'center'}));
}
const findEntry = id => { const s = getActive(); return s && s.entries.find(e => e.id === id); };

function finishSession() {
  const s = getActive();
  const kept = s.entries.map(en => ({...en, sets: en.sets.filter(st => st.done && isFinite(num(st.w)) && num(st.r) > 0)})).filter(en => en.sets.length);
  if (!kept.length) { toast('Tick off at least one set first'); return; }
  const loose = s.entries.reduce((a, en) => a + en.sets.filter(st => !st.done && (st.w !== '' || st.r !== '')).length, 0);
  if (loose) confirmSheet('Finish workout?', `${loose} set${loose > 1 ? 's have' : ' has'} numbers typed in but not ticked off — ${loose > 1 ? 'they' : 'it'} won't be saved.`, 'Finish anyway', () => commitFinish(s, kept));
  else commitFinish(s, kept);
}
function commitFinish(s, kept) {
  s.entries = kept;
  renumber(s);
  s.done = true; s.end = s.end || Date.now(); db.active = null; db.rest = null; delete db.editBackup;
  computeFactors(); recomputePRs();
  const prs = s.entries.filter(en => en.pr);
  save(); render(); renderRest();
  const mins = s.start ? Math.round((s.end - s.start) / 60000) : 0;
  const sets = s.entries.reduce((a, en) => a + en.sets.length, 0);
  const vol = s.entries.reduce((a, en) => a + en.sets.reduce((b, st) => b + num(st.w) * num(st.r), 0), 0);
  openSheet(`<h3>Workout done 💪</h3>
    <div class="big-stats">
      <div class="stat"><div class="k">Time</div><div class="v num">${mins}<small> min</small></div></div>
      <div class="stat"><div class="k">Sets</div><div class="v num">${sets}</div></div>
      <div class="stat"><div class="k">Volume</div><div class="v num">${Math.round(vol).toLocaleString('en-GB')}<small> kg</small></div></div></div>
    ${prs.length ? `<div class="pick-sec">New order-adjusted records</div><div class="pr-list">${prs.map(en => `<div class="row-item"><span class="badge-pr" style="margin:0">PR</span><div class="grow"><div class="t">${esc(getEx(en.exId).name)}</div><div class="s">as ${ord(slot(en))} · ${esc(setsText(en.sets))}</div></div></div>`).join('')}</div>` : '<p class="explain">No new records this time — consistency is what builds them.</p>'}
    <button class="btn primary block" style="margin-top:8px" data-act="close-sheet">Nice</button>`);
}

function exportData() {
  const blob = new Blob([JSON.stringify(db, null, 1)], {type: 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `liftbook-backup-${today()}.json`;

}
$('#importFile').addEventListener('change', async ev => {
  const f = ev.target.files[0]; ev.target.value = '';
  if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    const ok = d && d.v === 1 && Array.isArray(d.exercises) && Array.isArray(d.sessions) && d.settings &&
      d.exercises.every(e => e && e.id && e.name) &&
      d.sessions.every(s => s && s.id && /^\d{4}-\d\d-\d\d$/.test(s.date) && Array.isArray(s.entries) &&
        s.entries.every(en => en && en.exId && Array.isArray(en.sets)));
    if (!ok) throw new Error('bad');
    confirmSheet('Replace all data?', `The backup has ${d.sessions.filter(s => s.done).length} workouts and ${d.exercises.length} exercises. It replaces what is on this phone now.`, 'Replace', () => {
      try { localStorage.setItem(KEY + '.before-import', JSON.stringify(db)); } catch (e) {}
      leaveDetail(); db = d; computeFactors(); recomputePRs(); save(); ui.tab = 'train'; render(); renderRest(); toast('Backup restored');
    });
  } catch (e) { toast('That file is not a Liftbook backup'); }
});

/* ============ rest timer ============ */
const restEl = $('#rest');
let restDoneShown = false;
function startRest() {
  if (!db.settings.rest) return;
  db.rest = {end: Date.now() + db.settings.rest * 1000}; restDoneShown = false; save(); renderRest();
}
function renderRest() {
  document.body.classList.toggle('resting', !!db.rest);
  if (!db.rest) { restEl.hidden = true; restEl.dataset.mode = ''; return; }
  const left = Math.round((db.rest.end - Date.now()) / 1000);
  restEl.hidden = false;
  if (left <= 0) {
    if (!restDoneShown) { restDoneShown = true; if (left > -5) try { navigator.vibrate?.([250, 120, 250]); } catch (e) {} }
    if (left < -20) { db.rest = null; save(); restEl.hidden = true; restEl.dataset.mode = ''; return; }
    if (restEl.dataset.mode !== 'go') {
      restEl.className = 'rest go';
      restEl.innerHTML = `<span class="tm" style="min-width:0">Next set</span><button data-act="rest-stop" aria-label="Dismiss">✕</button>`;
      restEl.dataset.mode = 'go';
    }
    return;
  }
  const t = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}`;
  if (restEl.dataset.mode !== 'run') {
    restEl.className = 'rest';
    restEl.innerHTML = `<span class="lbl">REST</span><span class="tm" id="restTm">${t}</span><button data-act="rest-add" data-v="-15">−15</button><button data-act="rest-add" data-v="15">+15</button><button data-act="rest-stop" aria-label="Stop timer">✕</button>`;
    restEl.dataset.mode = 'run';
  } else $('#restTm').textContent = t;
}
function tickClock() {
  const s = getActive(), el = $('#elapsed');
  if (s && el && s.start) { const m = Math.floor((Date.now() - s.start) / 60000); el.textContent = m >= 60 ? `${Math.floor(m / 60)}h ${m % 60}m` : `${m} min`; }
}
setInterval(() => {
  if (db.rest) renderRest();
  tickClock();
}, 1000);

/* ============ events ============ */

  const act = el.dataset.act;
  switch (act) {
    case 'tab': if (ui.sheetOpen) closeSheet(); if (ui.tab === 'detail') silentBack(); ui.tab = el.dataset.tab; ui.sel = null; render(); window.scrollTo(0, 0); break;
    case 'gym': db.settings.gym = ui.viewGym = el.dataset.g; save(); render(); break;
    case 'viewgym': ui.viewGym = el.dataset.g; ui.histLimit = 40; render(); break;
    case 'more-hist': ui.histLimit += 60; render(); break;
    case 'pick': ui.pick.has(el.dataset.g) ? ui.pick.delete(el.dataset.g) : ui.pick.add(el.dataset.g); render(); break;
    case 'start': startSession(); break;
    case 'add-ex': addExerciseSheet(); break;
    case 'pick-ex': {
      // an exercise from another gym becomes this gym's own copy, so the two machines keep separate histories
      const ex = getEx(el.dataset.x), g = getActive()?.gym;
      if (!ex || !g) { closeSheet(); break; }
      if (ex.gym && ex.gym !== g) {
        const base = ex.gym === 'other' ? ex.name.replace(/ \((Manna|Hals|FW|Greece)\)$/, '') : ex.name;
        let mine = db.exercises.find(e => e.gym === g && e.groupId === ex.groupId && e.name.toLowerCase() === base.toLowerCase());
        if (!mine) { mine = {...ex, id: uid(), gym: g, name: base, notes: ''}; db.exercises.push(mine); toast(`Added ${mine.name} to ${gymName(g)}`); }
        addEntry(mine.id);
      } else addEntry(ex.id);
      break;
    }
    case 'check': {
      const row = el.closest('.set-row'), en = findEntry(row.dataset.en), st = en.sets[+row.dataset.i];
      if (st.done) { st.done = false; row.classList.remove('done'); save(); break; }
      const wi = row.querySelector('[data-f="w"]'), ri = row.querySelector('[data-f="r"]');
      if (wi.value === '' && wi.placeholder && isFinite(num(wi.placeholder))) wi.value = wi.placeholder;
      if (ri.value === '' && ri.placeholder && isFinite(num(ri.placeholder))) ri.value = ri.placeholder;
      if (!isFinite(num(wi.value)) || !(num(ri.value) > 0)) { toast('Enter weight and reps first'); (isFinite(num(wi.value)) ? ri : wi).focus(); break; }
      st.w = wi.value.replace(',', '.'); st.r = String(Math.round(num(ri.value))); st.done = true;
      row.classList.add('done'); save(); startRest();
      try { navigator.vibrate?.(15); } catch (e) {}
      break;
    }
    case 'add-set': {
      const en = findEntry(el.dataset.en); const lastSet = en.sets[en.sets.length - 1];
      en.sets.push({w: lastSet?.done ? lastSet.w : '', r: '', done: false}); save(); render(); break;
    }
    case 'ex-menu': {
      const s = getActive(), i = s.entries.findIndex(e => e.id === el.dataset.en), en = s.entries[i];
      openSheet(`<h3>${esc(getEx(en.exId)?.name)}</h3>
        ${i > 0 ? `<button class="opt" data-act="move" data-en="${en.id}" data-d="-1">${ICON.up} Move earlier</button>` : ''}
        ${i < s.entries.length - 1 ? `<button class="opt" data-act="move" data-en="${en.id}" data-d="1">${ICON.down} Move later</button>` : ''}
        ${en.sets.length > 1 ? `<button class="opt" data-act="del-set" data-en="${en.id}">${ICON.trash} Remove last set</button>` : ''}
        <button class="opt" data-act="detail" data-x="${en.exId}">${ICON.chart} See progress</button>
        <button class="opt danger" data-act="remove-entry" data-en="${en.id}">${ICON.trash} Remove from workout</button>`);
      break;
    }
    case 'move': {
      const s = getActive(), i = s.entries.findIndex(e => e.id === el.dataset.en), j = i + +el.dataset.d;
      const a = s.entries[i], b = s.entries[j];
      if (s.src === 'keep') s.src = 'keep-edited';   // order now set by hand, number it like a normal workout
      [s.entries[i], s.entries[j]] = [b, a]; save(); closeSheet(); render(); break;
    }
    case 'del-set': { const en = findEntry(el.dataset.en); en.sets.pop(); save(); closeSheet(); render(); break; }
    case 'remove-entry': { const s = getActive(); s.entries = s.entries.filter(e => e.id !== el.dataset.en); save(); closeSheet(); render(); break; }
    case 'finish': finishSession(); break;
    case 'cancel-session':
      if (db.editBackup?.id === db.active) {
        confirmSheet('Cancel edit?', 'The workout goes back to how it was before you started editing.', 'Cancel edit', () => {
          db.sessions = db.sessions.map(x => x.id === db.active ? db.editBackup : x); delete db.editBackup; db.active = null; db.rest = null;
          computeFactors(); recomputePRs(); save(); render(); renderRest();
        });
      } else confirmSheet('Discard workout?', 'Everything logged in this workout will be removed.', 'Discard', () => { db.sessions = db.sessions.filter(x => x.id !== db.active); db.active = null; db.rest = null; save(); render(); renderRest(); });
      break;
    case 'close-sheet': closeSheet(); break;
    case 'confirm-ok': {
      const f = pendingConfirm; pendingConfirm = null;
      hideSheet(); ui.reuseEntry = true;
      try { f && f(); } finally { ui.reuseEntry = false; }
      if (!ui.sheetOpen) silentBack();   // no new sheet took over the history entry
      break;
    }
    case 'session': sessionSheet(db.sessions.find(s => s.id === el.dataset.s)); break;
    case 'del-session': { const id = el.dataset.s; confirmSheet('Delete workout?', 'This removes it from your history.', 'Delete', () => { db.sessions = db.sessions.filter(s => s.id !== id); computeFactors(); recomputePRs(); save(); render(); }); break; }
    case 'edit-session': {
      if (getActive()) { closeSheet(); toast('Finish the current workout first'); break; }
      const s = db.sessions.find(x => x.id === el.dataset.s);
      db.editBackup = JSON.parse(JSON.stringify(s));
      s.done = false; db.active = s.id; computeFactors(); save(); closeSheet(); ui.tab = 'train'; render(); break;
    }
    case 'exgroup': ui.exGroup = el.dataset.g; render(); break;
    case 'detail':
      if (ui.sheetOpen) sheetToPage(); else history.pushState({page: 'detail'}, '');
      if (ui.tab !== 'detail') ui.detailFrom = ui.tab;
      ui.detail = el.dataset.x; ui.sel = null; ui.tab = 'detail'; render(); window.scrollTo(0, 0); break;
    case 'back': history.back(); break;
    case 'pt': ui.sel = +el.dataset.i; render(); break;
    case 'new-ex': exerciseForm(null, el.dataset.from); break;
    case 'edit-ex': exerciseForm(getEx(el.dataset.x)); break;
    case 'del-ex': {
      const id = el.dataset.x, n = logOf(id).length;
      confirmSheet('Delete exercise?', n ? `It has ${n} logged session${n > 1 ? 's' : ''}; those sets will be removed too.` : 'It has no logged sessions.', 'Delete', () => {
        db.exercises = db.exercises.filter(e => e.id !== id);
        db.sessions.forEach(s => { s.entries = s.entries.filter(en => en.exId !== id); });
        db.sessions = db.sessions.filter(s => !s.done || s.entries.length);
        computeFactors(); recomputePRs(); save(); if (ui.tab === 'detail') { ui.tab = ui.detailFrom || 'exercises'; silentBack(); } render();
      });
      break;
    }
    case 'settings': settingsSheet(); break;
    case 'set-rest': db.settings.rest = +el.dataset.v; save(); settingsSheet(); break;
    case 'export': exportData(); break;
    case 'import': $('#importFile').click(); break;
    case 'reset': confirmSheet('Erase everything?', 'All exercises and workouts on this phone will be deleted. Export a backup first if you might want them.', 'Erase', () => { leaveDetail(); try { localStorage.setItem(KEY + '.before-erase', JSON.stringify(db)); } catch (e) {} db = {v: 1, exercises: [], sessions: [], active: null, rest: null, keepV2: true, settings: db.settings}; computeFactors(); save(); ui.tab = 'train'; render(); renderRest(); }); break;
    case 'rest-add': db.rest.end += +el.dataset.v * 1000; save(); restEl.dataset.mode = ''; renderRest(); break;
    case 'rest-stop': db.rest = null; save(); restEl.dataset.mode = ''; renderRest(); break;
  }
});
document.addEventListener('input', ev => {
  const el = ev.target;
  if (el.dataset.f) {
    const row = el.closest('.set-row'), en = findEntry(row.dataset.en);
    if (en) { en.sets[+row.dataset.i][el.dataset.f] = el.value; save(); }
  } else if (el.dataset.actInput === 'note') { const en = findEntry(el.dataset.en); if (en) { en.note = el.value; save(); } }
  else if (el.dataset.actInput === 'exsearch') { ui.exQuery = el.value; $('#exlist').innerHTML = exRows(); }
  else if (el.dataset.actInput === 'picksearch') { $('#picklist').innerHTML = pickList(el.value); }
});
document.addEventListener('keydown', ev => {
  if (ev.key !== 'Enter' || !ev.target.dataset.f) return;
  ev.preventDefault();
  const row = ev.target.closest('.set-row');
  if (ev.target.dataset.f === 'w') row.querySelector('[data-f="r"]').focus();
  else { ev.target.blur(); row.querySelector('.chk').click(); }
});
document.addEventListener('submit', ev => {
  if (ev.target.id !== 'exForm') return;
  ev.preventDefault();
  const f = new FormData(ev.target), id = ev.target.dataset.x, from = ev.target.dataset.from;
  const data = {name: f.get('name').trim(), groupId: f.get('groupId'), gym: f.get('gym'), notes: f.get('notes').trim(), inc: num(f.get('inc')) > 0 ? num(f.get('inc')) : 2.5};
  if (!data.name) return;
  if (id && !getEx(id)) { closeSheet(); return; }
  if (id) { Object.assign(getEx(id), data); save(); closeSheet(); render(); toast('Saved'); }
  else {
    const ex = {id: uid(), ...data}; db.exercises.push(ex); save();
    if (from === 'session' && getActive()) addEntry(ex.id);
    else { closeSheet(); render(); toast('Exercise created'); }
  }
});
document.addEventListener('visibilitychange', () => { if (!document.hidden) { renderRest(); tickClock(); } });

/* ============ boot ============ */
computeFactors(); recomputePRs();
if (getActive()) ui.tab = 'train';
render(); renderRest();
importKeep();
try { navigator.storage?.persist?.(); } catch (e) {}
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
  navigator.serviceWorker.addEventListener('message', ev => {
    if (ev.data !== 'updated') return;
    const t = $('#toast'); t.innerHTML = 'New version ready — <u>tap to update</u>'; t.classList.add('show'); clearTimeout(toastT);
    t.onclick = () => location.reload();
  });
}
if (readOnly) toast('Updating… close and reopen Liftbook');
</script>
</body>
</html>
