<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0c0d0f">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f3f4f1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Liftbook</title>
<style>
:root{
  --bg:#0c0d0f; --surface:#15171b; --surface-2:#1d2025; --surface-3:#262a31; --line:#2b3038;
  --text:#f2f4f7; --text-2:#a7adb8; --muted:#868d99;
  --accent:#c6f05f; --accent-ink:#11140a; --accent-soft:rgba(198,240,95,.12);
  --good:#5ee08f; --warn:#f6c453; --danger:#ff7a7a; --danger-soft:rgba(255,122,122,.12);
  --radius:18px; --radius-sm:12px;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f3f4f1; --surface:#ffffff; --surface-2:#f1f2ee; --surface-3:#e6e8e2; --line:#dcdfd6;
    --text:#14161a; --text-2:#4f5560; --muted:#686f7a;
    --accent:#4f7a00; --accent-ink:#ffffff; --accent-soft:rgba(79,122,0,.10);
    --good:#16803c; --warn:#a86b00; --danger:#c53030; --danger-soft:rgba(197,48,48,.08);
    --shadow:0 10px 30px rgba(20,22,26,.10);
    color-scheme:light;
  }
}
:root[data-theme="dark"]{color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom));overscroll-behavior-y:contain}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.num{font-variant-numeric:tabular-nums}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.02em;font-size:20px}
.brand svg{width:28px;height:28px}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--text-2)}
.icon-btn:active{background:var(--surface-2)}
.icon-btn svg{width:22px;height:22px}
main{padding:4px 16px 24px;max-width:640px;margin:0 auto}
body.resting main{padding-bottom:84px}
.chip-btn{background:var(--surface-3);color:var(--text)}
.chip svg{width:13px;height:13px}
h1{font-size:28px;letter-spacing:-.03em;margin:8px 0 4px;line-height:1.1}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:26px 0 10px;font-weight:700}
h3{margin:0;font-size:17px;letter-spacing:-.01em;line-height:1.25}
.sub{color:var(--text-2);margin:0 0 16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--surface-2);
  color:var(--text-2);font-size:12px;font-weight:600;white-space:nowrap}
.chip.gym{background:var(--accent-soft);color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 20px;border-radius:16px;
  font-weight:700;background:var(--surface-2);color:var(--text);transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn svg{width:20px;height:20px;flex:none}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:disabled{opacity:.35}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.block{width:100%}
.btn.small{height:40px;padding:0 14px;border-radius:12px;font-size:14px}
.link{color:var(--text-2);font-size:14px;font-weight:600;padding:10px}
.empty{color:var(--muted);text-align:center;padding:24px 8px}

/* group picker */
.groups{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 16px}
.gbtn{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 10px;text-align:left;min-height:64px;
  display:flex;flex-direction:column;justify-content:space-between;gap:4px}
.gbtn b{font-size:15px}
.gbtn small{color:var(--muted);font-size:12px}
.gbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.gbtn[aria-pressed="true"] small{color:var(--accent-ink);opacity:.7}

/* session */
.sess-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:6px 0 14px}
.sess-head .meta{color:var(--text-2);font-size:14px}
.ex-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.ex-head{display:flex;align-items:flex-start;gap:12px}
.pos{flex:none;width:42px;height:42px;border-radius:13px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;
  font-weight:900;font-size:21px;letter-spacing:-.04em}
.ex-title{flex:1;min-width:0}
.ex-title .row{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;align-items:center}
.slot{font-size:12px;color:var(--text-2);font-weight:600}
.hint{margin:12px 0 4px;padding:10px 12px;border-radius:12px;background:var(--surface-2);font-size:14px;color:var(--text-2)}
.hint b{color:var(--text)}
.hint .goal{display:block;margin-top:4px;color:var(--accent);font-weight:700}
.hint .goal small{color:var(--text-2);font-weight:500}
.note-in{width:100%;margin-top:10px;background:transparent;border:1px dashed var(--line);border-radius:10px;padding:8px 10px;font-size:14px;color:var(--text-2)}
.note-in:focus{outline:none;border-style:solid;border-color:var(--accent);color:var(--text)}
.sets{margin-top:10px}
.set-h,.set-row{display:grid;grid-template-columns:26px 1fr 1fr 18px 1fr 48px;gap:6px;align-items:center}
.set-h{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding:0 0 4px}
.set-row{padding:4px 0;border-radius:12px}
.set-row .idx{color:var(--muted);font-weight:700;text-align:center;font-size:14px}
.set-row .prev{color:var(--muted);font-size:13px;text-align:center}
.set-row input{width:100%;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);text-align:center;font-size:18px;font-weight:700;
  font-variant-numeric:tabular-nums;padding:0 4px}
.set-row input::placeholder{color:var(--muted);font-weight:600}
.set-row input:focus{outline:none;border-color:var(--accent)}
.set-row .x{text-align:center;color:var(--muted)}
.chk{height:44px;border-radius:12px;background:var(--surface-3);display:grid;place-items:center;color:var(--muted)}
.chk svg{width:22px;height:22px}
.set-row.done input{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.set-row.done .chk{background:var(--accent);color:var(--accent-ink)}
.add-set{margin-top:6px;width:100%;height:40px;border-radius:12px;color:var(--text-2);font-weight:700;font-size:14px;background:transparent;border:1px dashed var(--line)}
.add-ex{width:100%;height:64px;border-radius:var(--radius);border:2px dashed var(--line);color:var(--text);font-weight:800;font-size:16px;display:flex;gap:10px;align-items:center;justify-content:center}
.add-ex svg{width:22px;height:22px;color:var(--accent)}

/* lists */
.list{display:flex;flex-direction:column;gap:8px}
.row-item{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;width:100%}
.row-item .grow{flex:1;min-width:0}
.row-item .t{font-weight:700;overflow:hidden;text-overflow:ellipsis}
.row-item .s{color:var(--text-2);font-size:13px;margin-top:2px}
.row-item .r{color:var(--text-2);font-size:13px;text-align:right;white-space:nowrap}
.chev{color:var(--muted);width:18px;height:18px;flex:none}
.scroller{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 6px;margin:0 -16px;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.fchip{flex:none;height:36px;padding:0 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:14px;color:var(--text-2)}
.fchip[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.search{width:100%;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:0 14px;font-size:16px;margin:10px 0}
.search:focus{outline:none;border-color:var(--accent)}

/* history */
.hcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;width:100%;text-align:left;display:block}
.hcard .top-line{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.hcard .top-line .chip{white-space:normal;text-align:right;min-width:0}
.hcard .date{font-weight:800;font-size:17px}
.hcard ol{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.hcard li{display:grid;grid-template-columns:24px 1fr;gap:8px;font-size:14px}
.hcard li .n{width:22px;height:22px;border-radius:7px;background:var(--surface-3);display:grid;place-items:center;font-size:12px;font-weight:800}
.hcard li .sets-t{color:var(--text-2)}
.badge-pr{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:6px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:800;vertical-align:1px}

/* detail */
.back{display:inline-flex;align-items:center;gap:4px;color:var(--text-2);font-weight:700;padding:8px 0}
.back svg{width:20px;height:20px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat .k{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.stat .v{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-top:2px}
.stat .v small{font-size:13px;color:var(--text-2);font-weight:600}
.stats.two{grid-template-columns:1fr 1fr}
.stat .d{font-size:12px;color:var(--muted);margin-top:2px}
.stat .v.up{color:var(--good)} .stat .v.down{color:var(--danger)}
.otable{width:100%;border-collapse:collapse;font-size:14px}
.otable th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;text-align:left;padding:0 6px 6px;font-weight:700}
.otable td{padding:9px 6px;border-top:1px solid var(--line)}
.otable td.n{text-align:right;font-variant-numeric:tabular-nums}
.otable .pct{color:var(--text-2);font-size:12px}
.hint[data-act]{cursor:pointer}
.hint .more{float:right;color:var(--muted);font-size:12px;font-weight:700}
.chart-card{padding:14px 10px 10px}
.chart-card .ct{padding:0 6px;font-weight:700}
.chart-card .cs{padding:0 6px;color:var(--muted);font-size:12px;margin-top:2px}
.chart svg{width:100%;height:auto;display:block;margin-top:8px;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{fill:var(--muted);font-size:10px}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .dot circle{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.chart .dot text{fill:var(--text);font-size:10px;font-weight:800;text-anchor:middle;dominant-baseline:central}
.chart .dot.sel circle{fill:var(--accent)}
.chart .dot.sel text{fill:var(--accent-ink)}
.chart .hit{fill:transparent}
.readout{margin:8px 6px 0;padding:10px 12px;border-radius:12px;background:var(--surface-2);font-size:14px;color:var(--text-2)}
.readout b{color:var(--text)}
.hrow{padding:12px 0;border-top:1px solid var(--line)}
.hrow:first-child{border-top:0}
.hrow .l1{display:flex;justify-content:space-between;gap:8px;font-weight:700}
.hrow .l2{color:var(--text-2);font-size:14px;margin-top:2px}
.hrow .l3{color:var(--muted);font-size:13px;margin-top:2px;font-style:italic}
.ord{display:inline-block;padding:1px 8px;border-radius:7px;background:var(--surface-3);font-size:12px;font-weight:800;color:var(--text-2)}

/* bottom nav */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(3,1fr);
  padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 90%,transparent);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line)}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--muted);font-size:12px;font-weight:700;border-radius:12px}
.tabs button svg{width:24px;height:24px}
.tabs button[aria-current="page"]{color:var(--text)}
.tabs button[aria-current="page"] svg{color:var(--accent)}

/* rest pill */
.rest{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom));z-index:35;
  display:flex;align-items:center;gap:6px;padding:6px 6px 6px 16px;border-radius:999px;background:var(--surface-3);color:var(--text);border:1px solid var(--line);
  box-shadow:var(--shadow);font-weight:800;white-space:nowrap}
.rest .tm{font-size:20px;min-width:62px;font-variant-numeric:tabular-nums}
.rest .lbl{font-size:12px;opacity:.6;margin-right:4px}
.rest button{height:40px;min-width:46px;padding:0 10px;border-radius:999px;background:color-mix(in srgb,var(--text) 10%,transparent);font-weight:800;font-size:13px}
.rest.go{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.rest[hidden]{display:none}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:50}
.sheet-wrap[hidden]{display:none}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.55);animation:fade .18s}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--surface);border-radius:24px 24px 0 0;
  padding:10px 16px calc(20px + env(safe-area-inset-bottom));animation:up .22s cubic-bezier(.2,.8,.2,1);max-width:640px;margin:0 auto}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.sheet h3{font-size:20px;margin-bottom:12px}
.sheet .opt{display:flex;align-items:center;gap:12px;width:100%;padding:14px 4px;border-bottom:1px solid var(--line);font-weight:700;text-align:left}
.sheet .opt:last-child{border-bottom:0}
.sheet .opt.danger{color:var(--danger)}
.sheet .opt svg{width:20px;height:20px;color:var(--text-2)}
.field{display:block;margin:0 0 12px}
.field span{display:block;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);padding:10px 12px;font-size:16px}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{height:40px;padding:0 14px;border-radius:12px;background:var(--surface-2);font-weight:700;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.ftable{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
.ftable td,.ftable th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left}
.ftable th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.explain{color:var(--text-2);font-size:14px}
.pr-list{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.big-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 4px}
.toast{position:fixed;left:50%;width:max-content;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,calc(-100% - 24px - env(safe-area-inset-top)));visibility:hidden;z-index:60;background:var(--text);color:var(--bg);
  padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;transition:transform .25s,visibility .25s;box-shadow:var(--shadow);max-width:90vw}
.toast.show{transform:translate(-50%,0);visibility:visible}
.gymseg{display:grid;grid-template-columns:repeat(4,1fr);margin:12px 0 2px}
.seg.gymseg button{min-width:0;padding:0 3px;font-size:13px;height:44px;overflow-wrap:anywhere;line-height:1.1}
.modeseg{display:grid;grid-template-columns:1fr 1fr;margin:4px 0 16px}
.seg.modeseg button{height:38px}
.ph-card{padding:14px}
.ph-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.ph-top .s{color:var(--text-2);font-size:13px;margin-top:2px}
.ph-card .row-item{background:var(--surface-2);border-color:transparent;padding:10px 12px}
.set-row.pset-row,.set-h.pset-h{grid-template-columns:26px 1fr 14px 1fr 48px}
/* photos */
.pstrip{display:flex;gap:8px;overflow-x:auto;margin:10px 0 2px;padding-bottom:2px}
.pthumb{flex:none;width:64px;height:64px;border-radius:12px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;color:var(--text-2)}
.pthumb img{width:100%;height:100%;object-fit:cover;display:block}
.pthumb svg{width:24px;height:24px}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.pcell{position:relative;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:var(--surface-2)}
.pcell img{width:100%;height:100%;object-fit:cover;display:block}
.pcell span{position:absolute;left:6px;bottom:6px;font-size:11px;font-weight:700;padding:2px 6px;border-radius:8px;background:rgba(0,0,0,.6);color:#fff}
.pview img{width:100%;max-height:62vh;object-fit:contain;border-radius:12px;background:var(--surface-2);display:block}
.pnav{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-top:10px;text-align:center;font-weight:700}
.pnav small{color:var(--muted);font-weight:600}
.pset-btns{display:grid;grid-template-columns:1fr auto;gap:8px}
.pset-btns .add-set:nth-child(2){padding:0 14px}
.pset-h span{text-align:center}
.chkline{display:flex;gap:10px;align-items:center;margin:2px 0 14px;color:var(--text-2);font-size:14px}
.chkline input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.trip{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.gymseg.five{grid-template-columns:.7fr 1fr 1.3fr 1fr 1fr;margin:8px 0 10px}
.restseg{display:grid;grid-template-columns:repeat(7,1fr)}
.seg.restseg button{padding:0;min-width:0}
.rep-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rep{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 10px 8px;min-width:0;text-align:left;width:100%}
.rep .t{font-weight:700;font-size:13px;line-height:1.25;min-height:2.5em;overflow-wrap:anywhere}
.rep .now{font-weight:800;font-size:17px;letter-spacing:-.01em;margin-top:4px}
.rep .from{color:var(--text-2);font-size:12px}
.rep svg{display:block;width:100%;height:auto;margin:6px 0 2px}
.rep .spark{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.rep .end{fill:var(--accent)}
.rep .base{stroke:var(--line);stroke-width:1}
.rep .mark{stroke:var(--muted);stroke-width:1;stroke-dasharray:2 2}
.rep .d{color:var(--muted);font-size:11px}
.rep .gain{color:var(--good);font-weight:700}
.two-btn{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:12px}
.pick-sec{margin:14px 0 6px;font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
/* variants, standard pictures, off days (v5) */
.vchips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.vchip{height:34px;padding:0 12px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-weight:700;font-size:13px;color:var(--text-2)}
.vchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.vchip.add{min-width:34px;padding:0 10px;border-style:dashed}
.pthumb{position:relative}
.pthumb.stock{background:#fff;border-style:dashed}
.pthumb .tag{position:absolute;left:3px;bottom:3px;font-size:9px;font-weight:800;padding:1px 4px;border-radius:5px;background:rgba(0,0,0,.62);color:#fff;line-height:1.3}
.lthumb{flex:none;width:44px;height:44px;border-radius:10px;object-fit:cover;background:var(--surface-2);display:block}
div.lthumb{border:1px dashed var(--line)}
.picpair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.picpair img{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:12px;background:#fff;display:block}
.picgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.picopt{display:flex;flex-direction:column;gap:4px;text-align:left;font-size:12px;font-weight:700;color:var(--text-2);min-width:0}
.picopt img{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:10px;background:#fff;display:block}
.picopt[aria-pressed="true"] img{outline:3px solid var(--accent)}
.offnote{display:block;margin:0 0 6px;color:var(--muted);font-size:13px}
.mini{display:inline-block;margin-left:6px;padding:2px 9px;border-radius:8px;background:var(--surface-3);color:var(--text);font-size:12px;font-weight:800;vertical-align:1px}
.mini:disabled{opacity:.6}
.tag-off{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:6px;background:var(--surface-3);color:var(--text-2);font-size:11px;font-weight:800;vertical-align:1px}
.prow{padding:4px 4px 4px 12px;gap:4px}
.prow .grow{display:block;text-align:left;padding:6px 0}
.prow .icon-btn{width:36px;height:36px}
.prow .icon-btn svg{width:18px;height:18px}
.offlist .row-item{align-items:flex-start}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
'use strict';
/* ============ constants ============ */
const KEY = 'liftbook.v1';
const GROUPS = [
  ['chest','Chest'],['back','Back'],['legs','Legs'],['biceps','Biceps'],['triceps','Triceps'],
  ['frontdelts','Front Delts'],['sidedelts','Side Delts'],['reardelts','Rear Delts'],
  ['calves','Calves'],['abs','Abs'],['traps','Traps']
];
const GYMS = [['aalborg', 'Aalborg'], ['bronderslev', 'Brønderslev'], ['klarup', 'Klarup'], ['other', 'Other']];
const gymName = id => (GYMS.find(g => g[0] === id) || [id, 'Any gym'])[1];
// How strong you are on the Nth exercise for a muscle, relative to doing it first.
// Starting guesses; the app replaces them with your own numbers as data comes in.
const DEFAULT_F = {1:1, 2:0.95, 3:0.91, 4:0.88, 5:0.86};
const PRIOR = 4;          // how many "pretend" observations the starting guess is worth
const PAIR_WINDOW = 60;   // days: a 2nd/3rd-slot session is compared with the nearest 1st-slot session within this window
// Off day: a session this far below your usual level is not used as next time's starting point (reps for bodyweight
// exercises), unless it came after a break of more than OFF_GAP days.
const OFF_DROP = 0.9, OFF_DROP_BW = 0.8, OFF_GAP = 28;

// Standard pictures from free-exercise-db (github.com/yuhonas/free-exercise-db, public domain). The ones used below are
// in img/ex/<id>-0.jpg / -1.jpg (start and end of the movement); others are loaded from GitHub when picked.
// Source list: keep-import/pic_map.json.
const PIC_GYM = {"45° Smith Press with Bands":"Smith_Machine_Incline_Bench_Press","Ab Machine – Highest Setting":"Ab_Crunch_Machine","Abdominal Crunch Bench":"Decline_Crunch","Alternative Leg Press":"Leg_Press","Barbell Shoulder Press":"Barbell_Shoulder_Press","Barbell Shrug":"Barbell_Shrug","Bench Press":"Barbell_Bench_Press_-_Medium_Grip","Bench Press Machine":"Machine_Bench_Press","Bent-Over Row":"Bent_Over_Barbell_Row","Biceps Curl Machine":"Machine_Bicep_Curl","Old Biceps Curl Machine":"Machine_Bicep_Curl","Cable Curl":"Standing_Biceps_Cable_Curl","Cable Fly":"Cable_Crossover","Cable Fly – Highest Pulley":"Cable_Crossover","Cable Forearm Curl":"Cable_Wrist_Curl","Cable Hammer Curl":"Cable_Hammer_Curls_-_Rope_Attachment","Cable Kickback":"Tricep_Dumbbell_Kickback","Cable Row":"Seated_Cable_Rows","Cable Shrug":"Cable_Shrugs","Calf Raise on Leg Press":"Calf_Press_On_The_Leg_Press_Machine","Chest Press Machine":"Leverage_Chest_Press","Chest-Supported Incline Dumbbell Row":"Dumbbell_Incline_Row","Chest-Supported Row":"Lying_T-Bar_Row","Decline Press":"Leverage_Decline_Chest_Press","Dumbbell Curl (both arms)":"Dumbbell_Bicep_Curl","Dumbbell Lateral Raise":"Side_Lateral_Raise","Dumbbell Lateral Raise to Overhead":"Side_Lateral_Raise","Dumbbell RDL":"Stiff-Legged_Dumbbell_Deadlift","Dumbbell Shoulder Press":"Dumbbell_Shoulder_Press","Face Pull":"Face_Pull","Flat Smith Machine Bench Press":"Smith_Machine_Bench_Press","Fly Machine":"Butterfly","Front Raise":"Front_Dumbbell_Raise","GHD & Variations (Hamstrings)":"Glute_Ham_Raise","Gym80 Shoulder Press Machine":"Machine_Shoulder_Military_Press","Hack Squat":"Hack_Squat","Pendulum Squat":"Hack_Squat","Hip Abductor":"Thigh_Abductor","Hip Adductor":"Thigh_Adductor","Hip Adductor & Abductor":"Thigh_Adductor","Horizontal Leg Press":"Leg_Press","Incline Leg Press":"Leg_Press","Leg Press":"Leg_Press","Single-Leg Horizontal Leg Press":"Leg_Press","Hyperextension":"Hyperextensions_Back_Extensions","Incline Bench Press":"Barbell_Incline_Bench_Press_-_Medium_Grip","Incline Cable Chest Press":"Incline_Cable_Chest_Press","Incline Cable Fly":"Incline_Cable_Flye","Incline Dumbbell Press":"Incline_Dumbbell_Press","Incline Press Machine":"Leverage_Incline_Chest_Press","Incline Press Machine (the other one)":"Leverage_Incline_Chest_Press","Incline Smith Machine Press":"Smith_Machine_Incline_Bench_Press","Iso-Lateral High Row":"Leverage_High_Row","Iso-Lateral Kneeling Leg Curl":"Standing_Leg_Curl","Iso-Lateral Low Row":"Leverage_Iso_Row","Iso-Lateral Row Machine":"Leverage_Iso_Row","Low Row Machine":"Leverage_Iso_Row","Row Machine":"Leverage_Iso_Row","Leg Extension":"Leg_Extensions","Leg Extension Machine":"Leg_Extensions","Low Cable Fly":"Low_Cable_Crossover","Seated Cable Fly":"Cable_Crossover","Lying Hamstring Curl":"Lying_Leg_Curls","Seated Hamstring Curl":"Seated_Leg_Curl","Seated Leg Curl":"Seated_Leg_Curl","Lying Lateral Raise":"Lying_One-Arm_Lateral_Raise","Lying Lateral Raise on Bench":"Lying_One-Arm_Lateral_Raise","Machine Press":"Leverage_Chest_Press","Meadows Row":"One-Arm_Long_Bar_Row","Overhead Cable Extension – High":"Cable_Rope_Overhead_Triceps_Extension","Overhead Cable Extension – Low":"Cable_Rope_Overhead_Triceps_Extension","Overhead Triceps Extension":"Triceps_Overhead_Extension_with_Rope","Pec Deck":"Butterfly","Preacher Curl":"Preacher_Curl","Pulldown":"Wide-Grip_Lat_Pulldown","Pulldown Machine":"Wide-Grip_Lat_Pulldown","Pulldown Variation":"Wide-Grip_Lat_Pulldown","Wide-Grip Pulldown":"Wide-Grip_Lat_Pulldown","Vertical Traction":"Wide-Grip_Lat_Pulldown","Reverse-Grip Pulldown":"Underhand_Cable_Pulldowns","Straight-Arm Pulldown":"Straight-Arm_Pulldown","RDL":"Romanian_Deadlift","RDL on Belt Squat":"Romanian_Deadlift","Rack Pull":"Rack_Pulls","Rear Delt Fly":"Reverse_Flyes","Rear Delt Swing Raise":"Reverse_Flyes","Rear Delt Fly Machine":"Reverse_Machine_Flyes","Single-Arm Rear Delt Fly":"Cable_Rear_Delt_Fly","Seated Calf Raise":"Seated_Calf_Raise","Seated Dumbbell Lateral Raise":"Seated_Side_Lateral_Raise","Shoulder Press":"Leverage_Shoulder_Press","Shrug on Bench Machine":"Leverage_Shrug","Single-Arm Cable Lateral Raise":"Standing_Low-Pulley_Deltoid_Raise","Standing Cable Lateral Raise (both arms)":"Cable_Seated_Lateral_Raise","X Cable Raise":"Cable_Seated_Lateral_Raise","Single-Arm Cable Row":"Seated_One-arm_Cable_Pulley_Rows","Single-Arm Dumbbell Curl":"Dumbbell_Alternate_Bicep_Curl","Single-Arm Smith Machine Row":"One-Arm_Dumbbell_Row","Smith Machine Shoulder Press":"Smith_Machine_Overhead_Shoulder_Press","Smith Squat":"Smith_Machine_Squat","Squat":"Barbell_Squat","Triceps Dip Machine":"Dip_Machine","Triceps Extension":"Triceps_Pushdown"};
const PIC_PH = {"leg-press-aal-1":"Leg_Press","leg-press-aal-2":"Leg_Press","leg-press-br-1":"Leg_Press","leg-press-br-2":"Leg_Press","calf-1":"Standing_Calf_Raises","bridge-1":"Barbell_Glute_Bridge","bridge-2":"Barbell_Glute_Bridge","bridge-3":"Barbell_Glute_Bridge","rdl":"Romanian_Deadlift","side-raise":"Side_Lateral_Raise","side-hold":"Side_Lateral_Raise","front-raise":"Front_Dumbbell_Raise","front-hold":"Front_Dumbbell_Raise","pushup-hold":"Pushups","shoulder-press":"Machine_Shoulder_Military_Press"};
const PIC_HERE = new Set([...Object.values(PIC_GYM), ...Object.values(PIC_PH), 'Seated_Leg_Curl', 'Lying_Leg_Curls', 'V-Bar_Pulldown', 'Close-Grip_Front_Lat_Pulldown', 'Underhand_Cable_Pulldowns']);
const PIC_LIB = 'https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/';
const picURL = (id, k = 0) => PIC_HERE.has(id) ? `img/ex/${id}-${k}.jpg` : `${PIC_LIB}${encodeURIComponent(id)}/${k}.jpg`;

const ICON = {
  chev:'<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  dots:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>',
  up:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>',
  down:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',
  chart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5M4 19h16M8 15l4-5 3 3 5-6"/></svg>',
  edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4z"/></svg>',
  camera:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
  image:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg>'
};

/* ============ helpers ============ */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-5);
const num = v => { const n = parseFloat(String(v ?? '').replace(',', '.')); return isFinite(n) ? n : NaN; };
const fmt = n => { if (!isFinite(n)) return ''; const r = Math.round(n * 100) / 100; return String(r); };
const roundTo = (x, inc) => Math.round(x / inc) * inc;
const ord = n => n + (['th','st','nd','rd'][(n % 100 - 20) % 10] || ['th','st','nd','rd'][n % 100] || 'th');
const gName = id => (GROUPS.find(g => g[0] === id) || [id, id])[1];
const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const dateObj = s => new Date(s + 'T12:00:00');
const fmtDate = (s, long) => { const d = dateObj(s); const o = {day:'numeric', month:'short'}; if (long) o.weekday = 'short'; if (d.getFullYear() !== new Date().getFullYear()) o.year = 'numeric'; return d.toLocaleDateString('en-GB', o); };
const daysAgo = s => Math.round((dateObj(today()) - dateObj(s)) / 864e5);
const agoText = s => { const d = daysAgo(s); return d === 0 ? 'today' : d === 1 ? 'yesterday' : d < 60 ? `${d} days ago` : fmtDate(s); };
const e1rm = (w, r) => (w > 0 && r > 0) ? w * (1 + Math.min(r, 15) / 30) : 0;   // Epley estimate
// search: every typed word must appear, ignoring spaces and dashes ("pull down" finds "Wide-Grip Pulldown")
const flat = s => String(s ?? '').toLowerCase().replace(/[^\p{L}\p{N}]/gu, '');
const hits = (text, q) => q.split(/\s+/).map(flat).filter(Boolean).every(w => flat(text).includes(w));
const setsText = sets =>sets.filter(s => s.done).map(s => `${fmt(num(s.w))}×${s.r}`).join(' · ');
const dayGap = (a, b) => Math.round((dateObj(b) - dateObj(a)) / 864e5);
// Variants of one exercise (Pulldown: wide grip / V-grip; hamstring curl: lying / seated). Each has its own suggestions
// and records. Sets logged before an exercise got variants have no variant id and count as its first variant.
const varsOf = x => x?.variants || [];
const vidOf = (x, v) => { const vs = varsOf(x); return vs.some(a => a.id === v) ? v : vs[0]?.id || ''; };
const varName = (x, v) => varsOf(x).length ? varsOf(x).find(a => a.id === vidOf(x, v)).name : '';
const exLabel = (x, v) => (x?.name || 'Deleted') + (varName(x, v) ? ' · ' + varName(x, v) : '');
// the standard picture of an exercise (or of one variant; a variant can also have "no picture" = '')
const picOf = (x, v) => { const va = varsOf(x).find(a => a.id === vidOf(x, v)); return (va && 'img' in va ? va.img : x?.img) || ''; };

/* ============ storage ============ */
function emptyDb() {
  return {v: 1, exercises: [], sessions: [], active: null, rest: null, keepV2: false, physio: {programs: [], active: null}, physioV1: false,
          settings: {rest: 120, inc: 2.5, gym: 'aalborg', mode: 'gym'}};
}
let readOnly = false;   // set when the stored data was written by a newer version of the app
function load() {
  let raw = null;
  try { raw = localStorage.getItem(KEY); } catch (e) {}
  if (raw) {
    let d = null; try { d = JSON.parse(raw); } catch (e) {}
    if (d && d.v === 1) return d;
    if (d && d.v > 1) { readOnly = true; return d; }
    // unreadable: keep a copy instead of silently replacing it
    try { localStorage.setItem(KEY + '.corrupt.' + Date.now(), raw); } catch (e) {}
  }
  const d = emptyDb(); try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) {}
  return d;
}
function save() {
  dataV++;
  if (readOnly) { toast('Old app version — close and reopen Liftbook to update'); return; }
  try { localStorage.setItem(KEY, JSON.stringify(db)); }
  catch (e) { toast('Could not save — storage blocked or full'); }
}

let toastT;
let dataV = 0;   // bumped on every save, so cached lookups know when to refresh
const GYM_IDS = GYMS.map(g => g[0]);
// gyms used to be free text ("Brønderslev", "Manna", …): turn them into gym ids
const oldGym = g => GYM_IDS.includes(g) ? g : /brønderslev/i.test(g || '') ? 'bronderslev' : /klarup/i.test(g || '') ? 'klarup'
  : /manna|hals|fw/i.test(g || '') ? 'other' : /gym|gf|aalborg/i.test(g || '') ? 'aalborg' : '';
function migrateGyms(d) {
  d.settings.gym ||= 'aalborg';
  d.exercises.forEach(e => { e.gym = oldGym(e.gym); });
  const fill = x => {
    if (!x || x.gym) return;   // a workout without a gym gets the gym most of its exercises belong to
    const n = {};
    x.entries.forEach(en => { const g = d.exercises.find(e => e.id === en.exId)?.gym; if (g) n[g] = (n[g] || 0) + 1; });
    x.gym = Object.keys(n).sort((a, b) => n[b] - n[a])[0] || d.settings.gym;
  };
  d.sessions.forEach(fill); fill(d.editBackup);
}
let db = load();
migrateGyms(db);
db.physio ||= {programs: [], active: null};
// v3.2: clearer wording for extra sets noted in Keep
if (!db.physioFix2) {
  let n = 0;
  for (const p of db.physio.programs) for (const it of p.items) for (const e of it.log) if (e.note?.startsWith('other sets: ')) { e.note = 'Also: ' + e.note.slice(12); n++; }
  db.physioFix2 = true;
  if (n) save();
}
// v3.1: the normal leg press is done before the feet-high one, not replaced by it
if (!db.physioFix1) {
  for (const p of db.physio.programs) {
    if (p.id === 'nicklas-legs' && !String(p.note || '').trim()) p.note = 'Remember the angle of the shoulders and back.';
    for (const it of p.items) {
      if (/^leg-press-(aal|br)-1$/.test(it.id)) { it.retired = false; if (it.name === 'Leg press (v1)') it.name = 'Leg press'; }
      if (/^leg-press-(aal|br)-2$/.test(it.id) && it.notes === 'Version 2: feet higher on the plate') it.notes = 'Feet higher on the plate — done after the normal leg press';
    }
  }
  db.physioFix1 = true;
  if (db.physio.programs.length) save();
}
let factors = {};
const ui = {tab: 'train', pick: new Set(), exGroup: 'all', exQuery: '', detail: null, sel: null, sheetOpen: false,
            viewGym: db.settings.gym, histLimit: 40};

// One-time import of the full Google Keep history (keep-seed.json). Workouts logged in the app are kept.
async function importKeep() {
  if (db.keepV2 || readOnly) return;
  let data;
  try { const r = await fetch('keep-seed.json', {cache: 'no-cache'}); if (!r.ok) return; data = await r.json(); }
  catch (e) { return; }   // offline: try again next launch
  if (db.keepV2 || readOnly) return;   // erased or restored while downloading
  if (!data || !Array.isArray(data.exercises) || !Array.isArray(data.sessions)) return;
  const norm = n => String(n).toLowerCase().replace(/\s*\((manna|hals|fw|greece)\)$/, '').replace(/[–—-]/g, ' ').replace(/\s+/g, ' ').trim();
  const alias = {'ct fletcher triceps extension': 'ct fletcher triceps exercise', 'cable fly high pulley': 'cable fly highest pulley'};
  const exercises = data.exercises.map(e => ({...e}));
  const seedNames = new Set(exercises.map(e => e.groupId + '|' + norm(e.name)));

function chartSVG(h) {

  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Strength trend">${grid}${line}${dots.join('')}${xl}</svg></div>
    <div class="readout"><b>${fmtDate(p.x.date, true)}</b> · ${p.x.known ? ord(p.x.slot) + ' exercise' : 'order not noted'}${varName(ex, p.x.vid) ? ' · ' + esc(varName(ex, p.x.vid)) : ''}${offTag(offOf(h).get(p.x.en))}<br><span class="num">${esc(setsText(p.x.en.sets))}</span><br>
    ${bw ? `Top set <b class="num">${p.x.top.r} reps</b>` : `Est. 1RM <b class="num">${fmt(Math.round(p.x.best))} kg</b>${adj}`}</div>`;

function renderPhysioReport(pid) {

  }).join('');

    <h1>${esc(p.name)} — progress</h1>

    <div class="stats" style="margin-top:0">
      <div class="stat"><div class="k">Exercises</div><div class="v num">${items.length}</div></div>
      <div class="stat"><div class="k">Sessions</div><div class="v num">${longest}</div><div class="d">on the longest-running exercise</div></div>
      <div class="stat"><div class="k">Weight ups</div><div class="v num">${steps}</div><div class="d">new heaviest weight</div></div>
    </div>

    <p class="explain" style="margin-top:12px;font-size:13px">"Start" is the first entry for each exercise — mostly from the old Google Keep notes, which have no dates${dates.length ? `; sessions logged in Liftbook have dates, the first on ${fmtDate(dates[0])}` : ''}. The line shows weight per session (seconds or reps for exercises without weight); a dashed mark is where the exercise was made harder or changed, and "start" then counts from there. Tap an exercise for its full log. Old versions of an exercise are left out.</p>`;
}

// Photos are too big for localStorage, so they live in IndexedDB on the phone — and are NOT in the backup file.
// owner = a gym exercise id, 'ph:<physio exercise id>', or 'body' (progress photos).
// Store "photos" has the small thumbnail + info (loaded at start), store "full" the big picture (loaded when opened).
let photos = [];          // {id, owner, date, t}, newest first
const thumbURL = {};      // photo id -> object URL of its thumbnail
function idbOpen() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('liftbook-photos', 1);
    r.onupgradeneeded = () => { r.result.createObjectStore('photos', {keyPath: 'id'}); r.result.createObjectStore('full', {keyPath: 'id'}); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
async function idbTx(stores, mode, fn) {
  const d = await idbOpen();
  try {
    return await new Promise((res, rej) => {
      const tx = d.transaction(stores, mode), r = fn(tx);
      tx.oncomplete = () => res(r && r.result); tx.onerror = tx.onabort = () => rej(tx.error);
    });
  } finally { d.close(); }
}
async function loadPhotos() {
  try {
    const all = await idbTx(['photos'], 'readonly', tx => tx.objectStore('photos').getAll());
    photos = (all || []).map(({thumb, ...p}) => { thumbURL[p.id] = URL.createObjectURL(thumb); return p; }).sort((a, b) => b.date.localeCompare(a.date) || b.t - a.t);
  } catch (e) { photos = []; }
}
// scale a decoded picture down to at most `max` pixels on the long side, as JPEG (a phone photo is ~5 MB; this makes it ~0.3 MB)
function shrink(bmp, max, q) {
  const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  return new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('encode')), 'image/jpeg', q));
}
// the day a photo was taken: the EXIF date ("2026:10:21 14:05:33") near the start of a JPEG, else the file's date, never later than today
async function photoDay(file) {

  try { m = new TextDecoder('latin1').decode(await file.slice(0, 131072).arrayBuffer()).match(/(20\d\d):(\d\d):(\d\d) \d\d:\d\d:\d\d/); } catch (e) {}
  const s = m ? `${m[1]}-${m[2]}-${m[3]}` : (() => { const d = new Date(file.lastModified || Date.now()); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; })();
  return isNaN(dateObj(s)) || s > today() ? today() : s;
}
async function addPhoto(owner, file) {
  let bmp;

  catch (e) { toast("Couldn't read that photo (HEIC? Turn off \"High efficiency pictures\" in the camera settings)"); return; }
  try {
    // decode once and make both sizes from it, one after the other (a 200 MP photo takes ~800 MB decoded)
    const full = await shrink(bmp, 1600, 0.82), thumb = await shrink(bmp, 360, 0.72);
    bmp.close?.(); bmp = null;
    const p = {id: uid(), owner, date: await photoDay(file), t: Date.now(), gym: ui.photoGym || db.settings.gym};
    await idbTx(['photos', 'full'], 'readwrite', tx => { tx.objectStore('photos').put({...p, thumb}); tx.objectStore('full').put({id: p.id, blob: full}); });
    photos.unshift(p); photos.sort((a, b) => b.date.localeCompare(a.date) || b.t - a.t); thumbURL[p.id] = URL.createObjectURL(thumb);

// best library matches for a name: words that match (+ a few gym synonyms), machine/cable words count extra
const LIB_SYN = {pulldown: 'lat pulldown', rdl: 'romanian deadlift', hamstring: 'leg', pec: 'butterfly', deck: 'butterfly', fly: 'flye', flyes: 'flye', raise: 'raise', press: 'press', triceps: 'tricep triceps', biceps: 'bicep biceps'};
function libSearch(q, n = 40) {
  if (!lib) return [];
  const words = q.toLowerCase().split(/[^a-z0-9]+/).filter(w => w.length > 1 && !['the', 'on', 'with', 'and', 'both', 'arms', 'v1', 'v2'].includes(w));
  const want = new Set(words.flatMap(w => [w, ...(LIB_SYN[w] || '').split(' ')]).filter(Boolean));
  return lib.map(e => {
    const toks = (e[1] + ' ' + e[3]).toLowerCase().split(/[^a-z0-9]+/);
    let sc = 0;
    for (const w of want) if (toks.some(t => t === w || (w.length > 3 && t.startsWith(w)) || (t.length > 3 && w.startsWith(t)))) sc += words.includes(w) ? 2 : 1;
    if (/machine|lever/.test(q.toLowerCase()) && /machine|leverage/.test(e[1] + e[3])) sc += 1;
    if (/cable/.test(q.toLowerCase()) && /cable/.test(e[3])) sc += 1;
    return [sc - e[1].length / 100, e];

// "Variants" field in the exercise forms: names separated by commas
const variantField = (x, ph) => `<label class="field"><span>Variants (optional)</span><input name="variants" value="${esc(varsOf(x).map(v => v.name).join(', '))}" placeholder="${esc(ph)}">
  <p class="explain" style="margin:6px 0 0;font-size:13px">Versions of the exercise, separated by commas. Each gets its own suggestions and records. ${varsOf(x).length ? 'Renaming one keeps its history.' : 'The first one is what you have logged so far.'}</p></label>`;
// every logged entry of an exercise (gym: workout entries; physio: its log + today's session entry)
function entriesOf(x) {
  if (x.log) return [...x.log, ...(PH().active?.entries.filter(en => en.itemId === x.id) || [])];
  const out = [];
  for (const s of [...db.sessions, ...(db.editBackup ? [db.editBackup] : [])]) for (const en of s.entries) if (en.exId === x.id) out.push(en);
  return out;
}
// Save a new list of variant names. A name that stays keeps its id; a changed name in the same place is a rename.
// A variant with logged sets is never dropped. Returns a message when something had to be kept.
function applyVariants(x, raw) {
  const names = [...new Map(raw.split(',').map(n => n.trim()).filter(Boolean).map(n => [n.toLowerCase(), n])).values()];
  const old = varsOf(x), ens = entriesOf(x), first = old[0]?.id;
  if (first) ens.forEach(en => { if (!old.some(v => v.id === en.vid)) en.vid = first; });   // pin old "first variant" sets before the order can change
  const used = new Set(ens.map(en => en.vid).filter(Boolean)), taken = new Set();
  // names not in the old list are renames of the old names that disappeared, in order — but only when no variant
  // disappeared without a new name (then "rename" or "delete" can't be told apart, so nothing is renamed)
  const same = n => old.find(o => o.name.toLowerCase() === n.toLowerCase());
  const gone = old.filter(o => !names.some(n => n.toLowerCase() === o.name.toLowerCase()));
  const fresh = names.filter(n => !same(n)), renames = gone.length <= fresh.length ? gone : [];
  const next = names.map(n => {
    let v = same(n) || renames[fresh.indexOf(n)];
    v = v ? {...v, name: n} : {id: uid(), name: n};
    taken.add(v.id); return v;
  });
  const kept = old.filter(o => !taken.has(o.id) && used.has(o.id));
  next.push(...kept);
  if (next.length <= 1) {   // one variant is the same as none: everything is just the exercise again
    if (next[0]?.img && !x.img) x.img = next[0].img;
    delete x.variants; ens.forEach(en => { delete en.vid; });
  } else {
    x.variants = next;
    if (!first) ens.forEach(en => { en.vid = next[0].id; });   // what was logged so far = the first variant
  }
  return kept.length ? `Kept ${kept.map(v => v.name).join(', ')} — it has logged sets` : '';
}

function doMerge(src, t, tName, sName) {
  t.variants ||= [];
  const byName = (n, img) => { n = n.replace(/,/g, ' ').trim() || 'Variant'; let v = t.variants.find(a => a.name.toLowerCase() === n.toLowerCase()); if (!v) { v = {id: uid(), name: n}; if (img) v.img = img; t.variants.push(v); } return v.id; };
  if (!t.variants.length) { const id = byName(tName); entriesOf(t).forEach(en => { en.vid = id; }); }
  const map = {}, sv = varsOf(src);
  for (const v of sv) map[v.id] = byName(v.name, 'img' in v ? v.img : src.img);
  const one = sv.length ? null : byName(sName, src.img);
  for (const en of entriesOf(src)) { en.vid = one || map[vidOf(src, en.vid)]; en.exId = t.id; }
  if (t.variants.length < 2) { delete t.variants; entriesOf(t).forEach(en => { delete en.vid; }); }   // both got the same name
  if (!t.notes && src.notes) t.notes = src.notes;
  db.exercises = db.exercises.filter(e => e.id !== src.id);
  movePhotos(src.id, t.id);
  computeFactors(); recomputePRs(); save();
}

  db.sessions.push(s); db.active = s.id; ui.pick.clear(); save(); render();

function addEntry(exId) {
  const s = getActive(), vid = startVid(exId, s);
  const sug = suggest(exId, 1, s.id, vid);   // as many sets as the session the suggestion is based on
  const n = sug ? Math.max(1, sug.last.en.sets.filter(x => x.done).length) : 3;
  const en = {id: uid(), exId, note: '', sets: Array.from({length: n}, () => ({w: '', r: '', done: false}))};
  if (vid) en.vid = vid;
  s.entries.push(en); save(); closeSheet(); render();
  requestAnimationFrame(() => $('#card-' + en.id)?.scrollIntoView({behavior: 'smooth', block: 'center'}));
}
const findEntry = id => { const s = getActive(); return s && s.entries.find(e => e.id === id); };

function finishSession() {
  const s = getActive();
  const kept = s.entries.map(en => ({...en, sets: en.sets.filter(st => st.done && isFinite(num(st.w)) && num(st.r) > 0)})).filter(en => en.sets.length);
  if (!kept.length) { toast('Tick off at least one set first'); return; }
  const loose = s.entries.reduce((a, en) => a + en.sets.filter(st => !st.done && (st.w !== '' || st.r !== '')).length, 0);
  if (loose) confirmSheet('Finish workout?', `${loose} set${loose > 1 ? 's have' : ' has'} numbers typed in but not ticked off — ${loose > 1 ? 'they' : 'it'} won't be saved.`, 'Finish anyway', () => commitFinish(s, kept));
  else commitFinish(s, kept);
}
function commitFinish(s, kept) {
  s.entries = kept;
  renumber(s);
  s.done = true; s.end = s.end || Date.now(); db.active = null; db.rest = null; delete db.editBackup;
  computeFactors(); recomputePRs();
  const prs = s.entries.filter(en => en.pr);
  save(); render(); renderRest();
  const mins = s.start ? Math.round((s.end - s.start) / 60000) : 0;
  const sets = s.entries.reduce((a, en) => a + en.sets.length, 0);
  const vol = s.entries.reduce((a, en) => a + en.sets.reduce((b, st) => b + num(st.w) * num(st.r), 0), 0);
  // exercises clearly below your usual today: next time starts from the session before, unless you say it was fine
  const low = s.entries.filter(en => offWhy(s, en) === 'auto');
  const lowHtml = low.length ? `<div class="pick-sec">Below your usual today</div><div class="pr-list offlist">${low.map(en => `<div class="row-item"><div class="grow"><div class="t">${esc(exLabel(getEx(en.exId), en.vid))}</div>
      <div class="s">${esc(setsText(en.sets))} — next time starts from your previous level.</div></div><button class="mini" data-act="off-set" data-s="${s.id}" data-e="${en.id}">It was fine</button></div>`).join('')}</div>` : '';
  openSheet(`<h3>Workout done 💪</h3>
    <div class="big-stats">
      <div class="stat"><div class="k">Time</div><div class="v num">${mins}<small> min</small></div></div>
      <div class="stat"><div class="k">Sets</div><div class="v num">${sets}</div></div>
      <div class="stat"><div class="k">Volume</div><div class="v num">${Math.round(vol).toLocaleString('en-GB')}<small> kg</small></div></div></div>
    ${prs.length ? `<div class="pick-sec">New order-adjusted records</div><div class="pr-list">${prs.map(en => `<div class="row-item"><span class="badge-pr" style="margin:0">PR</span><div class="grow"><div class="t">${esc(exLabel(getEx(en.exId), en.vid))}</div><div class="s">as ${ord(slot(en))} · ${esc(setsText(en.sets))}</div></div></div>`).join('')}</div>` : '<p class="explain">No new records this time — consistency is what builds them.</p>'}
    ${lowHtml}
    <button class="btn block" style="margin-top:8px" data-act="off-session" data-s="${s.id}" data-keep="1">Felt off today? Mark the whole workout</button>
    <button class="btn primary block" style="margin-top:8px" data-act="close-sheet">Nice</button>`);
}

/* ============ rest timer ============ */
const restEl = $('#rest');
let restDoneShown = false;
function startRest() {
  if (!db.settings.rest) return;
  db.rest = {end: Date.now() + db.settings.rest * 1000}; restDoneShown = false; save(); renderRest();
}
// Sound in headphones when the rest is over (Settings). A web app can't tell whether headphones are in, and the phone
// pauses it while the screen is off. So it posts a silent notification "REST 120 s"; a MacroDroid macro on the phone
// waits that long and plays a sound only if headphones are connected. Stopping the timer removes the notification,
// which cancels the macro. After a normal end the notification is removed 20 s later, when the timer pill goes away.
let noteEnd = null;
function restNotify() {
  const end = db.rest?.end ?? null;
  if (end === noteEnd) return;
  noteEnd = end;
  if (!db.settings.restAlert || !('Notification' in window) || Notification.permission !== 'granted' || !navigator.serviceWorker) return;
  navigator.serviceWorker.ready.then(reg => {
    if (end !== noteEnd) return;   // changed again while waiting
    if (end && end > Date.now())
      return reg.showNotification('Liftbook rest', {tag: 'lb-rest', silent: true, renotify: true,
        body: `REST ${Math.round((end - Date.now()) / 1000)} s · until ${new Date(end).toLocaleTimeString('en-GB')}`});
    if (!end) return reg.getNotifications({tag: 'lb-rest'}).then(ns => ns.forEach(n => n.close()));
  }).catch(() => {});
}
function renderRest() {
  restNotify();
  document.body.classList.toggle('resting', !!db.rest);
  if (!db.rest) { restEl.hidden = true; restEl.dataset.mode = ''; return; }
  const left = Math.round((db.rest.end - Date.now()) / 1000);
  restEl.hidden = false;
  if (left <= 0) {
    if (!restDoneShown) { restDoneShown = true; if (left > -5) try { navigator.vibrate?.([250, 120, 250]); } catch (e) {} }
    if (left < -20) { db.rest = null; save(); restEl.hidden = true; restEl.dataset.mode = ''; return; }
    if (restEl.dataset.mode !== 'go') {
      restEl.className = 'rest go';
      restEl.innerHTML = `<span class="tm" style="min-width:0">Next set</span><button data-act="rest-stop" aria-label="Dismiss">✕</button>`;
      restEl.dataset.mode = 'go';
    }
    return;
  }
  const t = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}`;
  if (restEl.dataset.mode !== 'run') {
    restEl.className = 'rest';
    restEl.innerHTML = `<span class="lbl">REST</span><span class="tm" id="restTm">${t}</span><button data-act="rest-add" data-v="-15">−15</button><button data-act="rest-add" data-v="15">+15</button><button data-act="rest-stop" aria-label="Stop timer">✕</button>`;
    restEl.dataset.mode = 'run';
  } else $('#restTm').textContent = t;
}
function tickClock() {
  const s = getActive() || PH().active, el = $('#elapsed');
  if (s && el && s.start) { const m = Math.floor((Date.now() - s.start) / 60000); el.textContent = m >= 60 ? `${Math.floor(m / 60)}h ${m % 60}m` : `${m} min`; }
}
setInterval(() => {
  if (db.rest) renderRest();
  tickClock();
}, 1000);

    if (!data.name) return;
    if (!data.lo !== !data.hi) { toast('Fill in both "from" and "to", or neither'); return; }
    if (data.lo && data.lo > data.hi) { toast('"From" must be below "to"'); return; }
    let msg = '';
    if (id) { const {it} = phItem(id); if (!it) { closeSheet(); return; } Object.assign(it, data); msg = applyVariants(it, f.get('variants') || ''); }
    else {
      const it = {id: uid(), ...data, log: []}; applyVariants(it, f.get('variants') || ''); p.items.push(it); autoPic(it);
      if (ev.target.dataset.from === 'session' && PH().active?.progId === p.id) PH().active.entries.push(phNewEntry(it));
    }
    save(); closeSheet(); render(); toast(msg || 'Saved');
    return;
  }
  if (ev.target.id === 'varForm') {
    ev.preventDefault();
    const f = new FormData(ev.target), ex = getEx(ev.target.dataset.x); if (!ex) { closeSheet(); return; }
    const name = f.get('name').replace(/,/g, ' ').trim(), first = (f.get('first') || '').replace(/,/g, ' ').trim();
    if (!name || (!varsOf(ex).length && !first)) return;
    if ((varsOf(ex).length ? varsOf(ex).map(v => v.name) : [first]).some(n => n.toLowerCase() === name.toLowerCase())) { toast('That variant already exists'); return; }
    const msg = applyVariants(ex, [...(varsOf(ex).length ? varsOf(ex).map(v => v.name) : [first]), name].join(','));
    const v = varsOf(ex).find(a => a.name.toLowerCase() === name.toLowerCase()), en = findEntry(ev.target.dataset.en);
    if (en && v) en.vid = v.id;   // today you're doing the new one
    computeFactors(); recomputePRs(); save(); closeSheet(); render(); toast(msg || `Added ${name}`);
    return;
  }
  if (ev.target.id === 'mergeForm') {
    ev.preventDefault();
    const f = new FormData(ev.target), src = getEx(ev.target.dataset.x), t = getEx(ev.target.dataset.t);
    if (!src || !t) { closeSheet(); return; }
    doMerge(src, t, String(f.get('tname') || '').trim() || t.name, String(f.get('sname') || '').trim() || src.name);
    closeSheet();
    if (ui.tab === 'detail') { ui.detail = t.id; ui.detailVid = ''; }
    render(); toast(`Merged into ${t.name}`);
    return;
  }
  if (ev.target.id !== 'exForm') return;
  ev.preventDefault();
  const f = new FormData(ev.target), id = ev.target.dataset.x, from = ev.target.dataset.from;
  const data = {name: f.get('name').trim(), groupId: f.get('groupId'), gym: f.get('gym'), notes: f.get('notes').trim(), inc: num(f.get('inc')) > 0 ? num(f.get('inc')) : 2.5};
  if (!data.name) return;
  if (id && !getEx(id)) { closeSheet(); return; }
  if (id) {
    const ex = getEx(id); Object.assign(ex, data);
    const msg = applyVariants(ex, f.get('variants') || '');
    computeFactors(); recomputePRs(); save(); closeSheet(); render(); toast(msg || 'Saved');
  }
  else {
    const ex = {id: uid(), ...data}; applyVariants(ex, f.get('variants') || ''); db.exercises.push(ex); save(); autoPic(ex);
    if (from === 'session' && getActive()) addEntry(ex.id);
    else { closeSheet(); render(); toast('Exercise created'); }
  }
});
// the phone keeps the app alive instead of reloading it, so look for a new version whenever it comes back
let lastCheck = Date.now();
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  renderRest(); tickClock();
  if (Date.now() - lastCheck > 60000 && navigator.serviceWorker?.controller) { lastCheck = Date.now(); fetch('./', {cache: 'no-cache'}).catch(() => {}); }
});

/* ============ boot ============ */
computeFactors(); recomputePRs(); addPhysioPress(); physioV5(); applyPics();
if (getActive() || PH().active) ui.tab = 'train';
render(); renderRest();
importKeep().then(importPhysio);
loadPhotos().then(() => { if (photos.length) photoRefresh(); });
try { navigator.storage?.persist?.(); } catch (e) {}
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
  navigator.serviceWorker.addEventListener('message', ev => {
    if (ev.data !== 'updated') return;
    const t = $('#toast'); t.innerHTML = 'New version ready — <u>tap to update</u>'; t.classList.add('show'); clearTimeout(toastT);
    t.onclick = () => location.reload();
  });
}
if (readOnly) toast('Updating… close and reopen Liftbook');
// keep the standard pictures on the phone, so they also show in a gym without signal (sw.js serves them from this cache)
function cachePics() {
  if (!('caches' in window) || !navigator.onLine || !navigator.serviceWorker?.controller) return;
  const all = [...db.exercises, ...PH().programs.flatMap(p => p.items)];
  const ids = new Set(all.flatMap(x => [picOf(x), ...varsOf(x).map(v => picOf(x, v.id))]).filter(id => id && PIC_HERE.has(id)));
  caches.open('liftbook-img').then(async c => {
    for (const id of ids) for (const k of [0, 1]) { const u = picURL(id, k); if (!(await c.match(u))) await c.add(u).catch(() => {}); }
  }).catch(() => {});
}
setTimeout(cachePics, 8000);
</script>
